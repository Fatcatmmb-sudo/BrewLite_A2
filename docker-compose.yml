services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-a2-compose-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_local_password}
      POSTGRES_DB: brewlite
    ports:
      - "5433:5432"
    volumes:
      - brewlite_a2_compose_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.local
    container_name: brewlite-a2-compose-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD:-brewlite_local_password}@postgres:5432/brewlite?schema=public
      JWT_ISSUER: brewlite-api
      JWT_AUDIENCE: brewlite-web
      PAYMENT_PROVIDER: mock
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: brewlite-a2-compose-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  brewlite_a2_compose_pgdata: