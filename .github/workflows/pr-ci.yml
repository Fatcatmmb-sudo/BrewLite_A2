name: Pull Request CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-tests:
    name: CI runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/ci-projects.test.mjs

  quality:
    name: Install, lint, unit test and build
    needs: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate npm projects and scripts
        run: node scripts/ci-projects.mjs validate
      - name: Install
        run: node scripts/ci-projects.mjs install
      - name: Lint
        run: node scripts/ci-projects.mjs lint
      - name: Unit test
        run: node scripts/ci-projects.mjs test
      - name: Build
        run: node scripts/ci-projects.mjs build

  required:
    name: PR quality gate
    if: ${{ always() }}
    needs: [ci-tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RUNNER_TESTS: ${{ needs.ci-tests.result }}
          QUALITY: ${{ needs.quality.result }}
        run: test "$RUNNER_TESTS" = success && test "$QUALITY" = success
